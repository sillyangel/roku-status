<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Roku TV Control</title>
    <style>
      body { font-family: system-ui, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
      .card { text-align:center; padding:24px; border:1px solid #ddd; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.06); }
      button { font-size:18px; padding:12px 20px; }
      #status { margin-top:12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Roku TV</h1>
      <button id="power">Turn Off TV</button>
      <div id="status"></div>
    </div>

    <script>
      const btn = document.getElementById('power')
      const status = document.getElementById('status')
      btn.addEventListener('click', async () => {
        btn.disabled = true
        status.textContent = 'Sending power command...'
        try {
          const res = await fetch('/roku/off', {method: 'POST'})
          const data = await res.json()
          if (res.ok) status.textContent = 'Power command sent. Your IP: ' + (data.ip || 'unknown')
          else status.textContent = 'Error: ' + (data.error || res.status) + ' (Your IP: ' + (data.ip || 'unknown') + ')'
        } catch (err) {
          status.textContent = 'Error: ' + err.message
        }
        btn.disabled = false
      })
    </script>
  </body>
</html>
